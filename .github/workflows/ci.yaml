name: logfmt CI

on:
  pull_request:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust_toolchain:
          - stable
          - nightly
    timeout-minutes: 5

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: "Install: Rust toolchain"
        uses: actions-rs/toolchain@v1
        with:
          components: clippy, rustfmt
          override: true
          profile: minimal
          toolchain: ${{ matrix.rust_toolchain }}

      - name: "Cargo: Check"
        uses: actions-rs/cargo@v1
        with:
          command: check

      - name: "Cargo: Build"
        uses: actions-rs/cargo@v1
        with:
          command: build

      - name: "Cargo: Test"
        uses: actions-rs/cargo@v1
        with:
          command: test

      - name: "Check: Clippy"
        uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: -- -D warnings

      - name: "Check: Rustfmt"
        uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all -- --check
